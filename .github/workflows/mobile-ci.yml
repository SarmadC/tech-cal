name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'src/app/api/events/submit/**'
      - 'src/lib/eventSubmission.ts'
      - 'src/utils/supabase/requestAuth.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-release.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - 'src/app/api/events/submit/**'
      - 'src/lib/eventSubmission.ts'
      - 'src/utils/supabase/requestAuth.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:

jobs:
  boundary-checks:
    name: Boundary Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify web does not import Expo or React Native modules
        run: |
          if rg -n "from ['\"](expo|expo-[^'\"]*|react-native|react-native-[^'\"]*)" src; then
            echo "Expo and React Native imports must stay inside apps/mobile."
            exit 1
          fi

  mobile-verification:
    name: Mobile Verification
    runs-on: ubuntu-latest
    needs: boundary-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Run mobile CI suite
        run: npm run mobile:ci
