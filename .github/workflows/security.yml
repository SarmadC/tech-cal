# .github/workflows/security.yml
name: Security Scan
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # Dependency scanning
      - name: Run npm audit
        run: npm audit --audit-level moderate
      
      # SAST scanning
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
      
      # Secret scanning
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD