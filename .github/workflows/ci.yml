name: Web CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-release.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-release.yml'

jobs:
  focused-scoring:
    name: Focused Scoring
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source type check
        run: npm run type-check:src

      - name: Run focused scoring tests
        env:
          DISCOVERY_SCORING: server
        run: npm run test:scoring

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify web does not import Expo or React Native modules
        run: |
          if rg -n "from ['\"](expo|expo-[^'\"]*|react-native|react-native-[^'\"]*)" src; then
            echo "Expo and React Native imports must stay inside apps/mobile."
            exit 1
          fi

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source type check
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run type-check:src

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-key-for-ci-build'
          NEXT_PUBLIC_SENTRY_DSN: 'https://test@sentry.io/123456'
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [focused-scoring, lint, type-check, unit-tests, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-key-for-ci-build'
          NEXT_PUBLIC_SENTRY_DSN: 'https://test@sentry.io/123456'
        run: npm run build

      - name: Start application
        run: npm start &

      - name: Wait for application to start
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: npm run test:e2e
