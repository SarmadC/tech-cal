name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: 'Release target'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Build platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - all
          - ios
          - android
      submit_to_store:
        description: 'Submit the latest production iOS build to App Store Connect'
        required: true
        default: false
        type: boolean
      asc_app_id:
        description: 'App Store Connect numeric Apple ID (required when submitting iOS)'
        required: false
        type: string

jobs:
  verify:
    name: Verify Mobile Release Inputs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Run mobile release checks
        run: npm run mobile:ci && npm run mobile:release:check

  preview-build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    needs: verify
    if: github.event.inputs.release_target == 'preview'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview release
        working-directory: apps/mobile
        env:
          MOBILE_PLATFORM: ${{ github.event.inputs.platform }}
        run: npm run build:preview -- --platform "$MOBILE_PLATFORM"

  production-build:
    name: EAS Production Build
    runs-on: ubuntu-latest
    needs: verify
    if: github.event.inputs.release_target == 'production'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix apps/mobile ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production release
        working-directory: apps/mobile
        env:
          MOBILE_PLATFORM: ${{ github.event.inputs.platform }}
        run: npm run build:production -- --platform "$MOBILE_PLATFORM"

      - name: Configure App Store Connect submission
        if: github.event.inputs.submit_to_store == 'true' && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all')
        working-directory: apps/mobile
        env:
          APP_STORE_CONNECT_APP_ID: ${{ github.event.inputs.asc_app_id }}
        run: npm run configure:ios-submit

      - name: Submit latest iOS build to App Store Connect
        if: github.event.inputs.submit_to_store == 'true' && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all')
        working-directory: apps/mobile
        run: npx eas-cli submit --platform ios --profile production --latest --non-interactive --wait
