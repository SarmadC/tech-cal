name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: 'Release target'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Build platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android

jobs:
  verify:
    name: Verify Mobile Release Inputs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shared packages and mobile app
        run: npm run mobile:ci

  preview-build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    needs: verify
    if: github.event.inputs.release_target == 'preview'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview release
        working-directory: apps/mobile
        run: npx eas-cli build --profile preview --platform ${{ github.event.inputs.platform }} --non-interactive

  production-release:
    name: EAS Production Release
    runs-on: ubuntu-latest
    needs: verify
    if: github.event.inputs.release_target == 'production'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview validation release
        working-directory: apps/mobile
        run: npx eas-cli build --profile preview --platform ${{ github.event.inputs.platform }} --non-interactive

      - name: Build and submit production release
        working-directory: apps/mobile
        run: npx eas-cli build --profile production --platform ${{ github.event.inputs.platform }} --auto-submit --non-interactive
