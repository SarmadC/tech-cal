<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Light mode styles (default) */
      .logo-bg {
        fill: #FFFFFF;
      }
      .asterisk-base {
        fill: #000000;
      }
      .asterisk-dark {
        fill: #000000;
        opacity: 0.3;
      }
      .asterisk-medium {
        fill: #000000;
        opacity: 0.5;
      }
      .asterisk-light {
        fill: #000000;
        opacity: 0.7;
      }
      .asterisk-bright {
        fill: #000000;
        opacity: 0.85;
      }
      .asterisk-brightest {
        fill: #000000;
        opacity: 1;
      }
      
      /* Dark mode styles - responds to system preference */
      @media (prefers-color-scheme: dark) {
        .logo-bg {
          fill: #000000;
        }
        .asterisk-base {
          fill: #FFFFFF;
        }
        .asterisk-dark {
          fill: #FFFFFF;
          opacity: 0.3;
        }
        .asterisk-medium {
          fill: #FFFFFF;
          opacity: 0.5;
        }
        .asterisk-light {
          fill: #FFFFFF;
          opacity: 0.7;
        }
        .asterisk-bright {
          fill: #FFFFFF;
          opacity: 0.85;
        }
        .asterisk-brightest {
          fill: #FFFFFF;
          opacity: 1;
        }
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" class="logo-bg"/>
  
  <!-- 3D Asterisk - 6 arms extending from center -->
  
  <!-- Back-left arm (going back-left into the scene) -->
  <polygon points="60,60 52,56 28,68 36,72" class="asterisk-dark"/>
  <polygon points="36,72 28,68 28,76 36,80" class="asterisk-dark"/>
  <polygon points="60,60 36,72 36,80 60,68" class="asterisk-medium"/>
  
  <!-- Back-right arm (going back-right into the scene) -->
  <polygon points="60,60 68,56 92,68 84,72" class="asterisk-light"/>
  <polygon points="84,72 92,68 92,76 84,80" class="asterisk-medium"/>
  <polygon points="60,60 84,72 84,80 60,68" class="asterisk-light"/>
  
  <!-- Bottom arm (going down) -->
  <polygon points="52,64 60,68 60,100 52,96" class="asterisk-medium"/>
  <polygon points="68,64 60,68 60,100 68,96" class="asterisk-dark"/>
  <polygon points="52,96 60,100 68,96 60,92" class="asterisk-dark"/>
  
  <!-- Front-left arm (coming forward-left) -->
  <polygon points="60,60 52,64 28,52 36,48" class="asterisk-bright"/>
  <polygon points="36,48 28,52 28,44 36,40" class="asterisk-light"/>
  <polygon points="60,60 36,48 36,40 60,52" class="asterisk-bright"/>
  
  <!-- Front-right arm (coming forward-right) -->
  <polygon points="60,60 68,64 92,52 84,48" class="asterisk-brightest"/>
  <polygon points="84,48 92,52 92,44 84,40" class="asterisk-bright"/>
  <polygon points="60,60 84,48 84,40 60,52" class="asterisk-brightest"/>
  
  <!-- Top arm (going up) -->
  <polygon points="52,56 60,52 60,20 52,24" class="asterisk-brightest"/>
  <polygon points="68,56 60,52 60,20 68,24" class="asterisk-brightest"/>
  <polygon points="52,24 60,20 68,24 60,28" class="asterisk-brightest"/>
  
  <!-- Center top face (brightest) -->
  <polygon points="52,56 60,52 68,56 60,60" class="asterisk-brightest"/>
  
</svg>