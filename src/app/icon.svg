<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Light mode styles (default) */
      .asterisk-color {
        fill: #000000;
        stroke: #000000;
      }
      
      /* Dark mode styles - responds to system preference */
    @media (prefers-color-scheme: dark) {
        .asterisk-color {
          fill: #FFFFFF;
          stroke: #FFFFFF;
        }
      }
    </style>
  </defs>
  
  <!-- Simplified Asterisk - 6 arms extending from center -->
  <!-- Center point -->
  <circle cx="16" cy="16" r="1.5" class="asterisk-color"/>
  
  <!-- 6 arms using thick strokes for visibility at small sizes -->
  <g stroke-width="2.5" stroke-linecap="round" fill="none" class="asterisk-color">
    <!-- Top arm (0°) -->
    <line x1="16" y1="16" x2="16" y2="6"/>
    <!-- Top-right arm (60°) -->
    <line x1="16" y1="16" x2="22.5" y2="9.5"/>
    <!-- Bottom-right arm (120°) -->
    <line x1="16" y1="16" x2="22.5" y2="22.5"/>
    <!-- Bottom arm (180°) -->
    <line x1="16" y1="16" x2="16" y2="26"/>
    <!-- Bottom-left arm (240°) -->
    <line x1="16" y1="16" x2="9.5" y2="22.5"/>
    <!-- Top-left arm (300°) -->
    <line x1="16" y1="16" x2="9.5" y2="9.5"/>
  </g>
  
</svg>
