appId: com.kurecal.mobile
---
- launchApp
- assertVisible: "Career velocity, rebuilt for the pocket."
- tapOn:
    point: "50%,45%"
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    point: "50%,54%"
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn: "Enter the app"
- assertVisible: "Discover"
- tapOn: "Calendar"
- assertVisible: "Plan the month"
- tapOn: "Community"
- assertVisible: "Suggested for You"
- tapOn: "Dashboard"
- assertVisible: "Recommended next"
- tapOn: "Settings"
- assertVisible: "Account and appearance"
- tapOn: "Dark"
- tapOn: "Manage subscription"
- assertVisible: "Upgrade without leaving the app"
